function payload(){return {version:1,house:'발코니 확장형',furniture:furniture.map(o=>({...o})),doors:doors.map(d=>({id:d.id,closed:d.closed})),induction:window.__induction||'original'}}
function saveNamed(){const name=prompt('배치 이름을 입력하세요 (최대 10개)');if(!name)return;let arr=JSON.parse(localStorage.getItem(KEY+'-plans')||'[]');const p=payload();p.name=name;const i=arr.findIndex(x=>x.name===name);if(i>=0)arr[i]=p;else arr.unshift(p);arr=arr.slice(0,10);try{localStorage.setItem(KEY+'-plans',JSON.stringify(arr));localStorage.setItem(KEY,JSON.stringify(payload()));toast('배치 저장: '+name)}catch(e){toast('로컬 저장 제한: JSON 내보내기를 사용하세요',true)}}
function loadNamed(){let arr=[];try{arr=JSON.parse(localStorage.getItem(KEY+'-plans')||'[]')}catch(e){}if(!arr.length){toast('저장된 배치가 없습니다');return}const name=prompt('불러올 이름: '+arr.map(x=>x.name).join(', '));if(!name)return;const p=arr.find(x=>x.name===name);if(p)applyPayload(p);else toast('해당 이름이 없습니다',true)}
function applyPayload(p){furniture=(p.furniture||[]).map(o=>({...o}));(p.doors||[]).forEach(x=>{const d=doors.find(y=>y.id===x.id);if(d){d.closed=x.closed;updateDoor(d)}});window.__induction=p.induction||'original';addInduction(window.__induction);selected=null;rebuildFurniture();validateAll();renderLabels();toast('배치 복원 완료')}
window.__save=saveNamed;window.__load=loadNamed;window.__export=()=>{const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='발코니확장형-배치.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};window.__import=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{applyPayload(JSON.parse(r.result))}catch(e){toast('JSON 형식이 올바르지 않습니다',true)}};r.readAsText(f)};i.click()};window.__clear=()=>{if(confirm('전체 가구를 삭제할까요?')){furniture=[];selected=null;rebuildFurniture();validateAll();renderPlaced();renderEditor();toast('전체 가구 비움')}};window.__initial=()=>{if(confirm('초기 배치로 복원할까요?')){location.reload()}};
window.__capture=()=>{const a=document.createElement('a');a.download='발코니확장형-'+mode+'-'+Date.now()+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};
window.__research=()=>{const p=$('#panel');p.classList.remove('hidden');p.innerHTML='<div class="section"><h3>🧪 연구소 · 쿡탑 비교</h3><div class="row"><button onclick="window.__ind(\'white\')">화이트 인덕션</button><button onclick="window.__ind(\'black\')">블랙 인덕션</button><button onclick="window.__ind(\'original\')">원래 쿡탑</button></div><div class="help">화이트: 삼성 NZ63DB607CFHEK 요청 모델. 삼성 공식 자료에서 확인 가능한 동일 계열 600×520×48mm 외형을 적용했으며, 정확한 EK suffix 자료는 확인되지 않아 추정으로 표시합니다.<br>블랙: 삼성 NZ63DG403CFK 요청 모델. 공식 페이지의 600×520×48mm, 타공 560×480mm를 적용했습니다.</div><div class="row"><button onclick="window.__kitchenClose()">주방 시점</button></div></div>'};window.__ind=k=>{window.__induction=k;addInduction(k);toast(k==='white'?'화이트 인덕션':k==='black'?'블랙 인덕션':'원래 쿡탑')};window.__kitchenClose=()=>{const r=roomMap.kitchen;setFP([6200,0,3950],[8350,0,1350]);persp.fov=55;persp.updateProjectionMatrix();setMode('fp');toast('연구소 · 주방 제품 비교 근접 시점')};
// drag furniture in 3D using raycast against floor
const ray=new T.Raycaster(),mouse=new T.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(mode==='2d')return;mouse.x=e.offsetX/renderer.domElement.clientWidth*2-1;mouse.y=-(e.offsetY/renderer.domElement.clientHeight)*2+1;ray.setFromCamera(mouse,activeCam);const hits=ray.intersectObjects(furnGroup.children,true);if(hits.length){let g=hits[0].object;while(g.parent&&g.parent!==furnGroup)g=g.parent;selected=g.userData.f;if(selected){renderEditor();showCollision(selected)}}});
renderer.domElement.addEventListener('dblclick',e=>{if(!selected||mode==='2d')return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-rect.left)/rect.width*2-1;mouse.y=-(e.clientY-rect.top)/rect.height*2+1;ray.setFromCamera(mouse,activeCam);const plane=new T.Plane(new T.Vector3(0,1,0),0),pt=new T.Vector3();if(ray.ray.intersectPlane(plane,pt)){selected.x=clamp(pt.x,300,14750);selected.z=clamp(pt.z,300,8350);applyMagnet(selected);updateSelectedMesh();renderEditor();showCollision(selected)}});
resize();setMode('fp');setFP([7600,0,6000],[9500,0,6500]);validateAll();
try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p)applyPayload(p)}catch(e){}
loop(performance.now());
})();
</script>
